<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hands</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #111;
    }
    main {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
    }
  </style>

  <!-- p5.js (the library OpenProcessing sketches use by default) -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
  <!-- ml5.js: hand tracking (handPose) -->
  <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
  <!-- p5.FIP: bloom/glow filter shaders -->
  <script src="https://prontopablo.github.io/p5.FIP/assets/javascripts/p5.FIP.js"></script>
  <!-- Uncomment if the sketch uses sound -->
  <!-- <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/addons/p5.sound.min.js"></script> -->
</head>
<body>
  <script src="sketch.js"></script>
</body>
</html>
